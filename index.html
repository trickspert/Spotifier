<!doctype html>
<html lang="en" data-mode="dark" data-title="clean" data-lyrics="bubbles">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <title>Spotifier</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="bg" aria-hidden="true"></div>

    <!-- Pages: home, library, liked, search, playlist/album -->
    <main id="view" class="view" tabindex="-1"></main>

    <!-- Floating glass dock: mini player + tab bar + search bubble -->
    <div class="dock">
      <div class="mini lg" data-act="open-player" role="button" tabindex="0" aria-label="Open player">
        <img class="np-art mini-art" alt="" />
        <span class="mini-meta"><b class="np-name">Nothing playing</b><span class="np-artist-small">Pick a song to start</span></span>
        <button class="icon-btn play-toggle" data-act="toggle" aria-label="Play"></button>
        <button class="icon-btn" data-act="next" aria-label="Next" data-icon="forward"></button>
        <span class="mini-line"><i></i></span>
      </div>
      <div class="dock-row">
        <nav class="tabbar lg" aria-label="Main">
          <span class="tab-pill" aria-hidden="true"></span>
          <a href="#/home" data-tab="home"><span data-icon="home"></span><b>Home</b></a>
          <a href="#/library" data-tab="library"><span data-icon="grid"></span><b>Library</b></a>
          <a href="#/liked" data-tab="liked"><span data-icon="heartOutline"></span><b>Liked</b></a>
          <button data-act="settings" data-tab="settings" aria-label="Customize"><span data-icon="user"></span><b>You</b></button>
        </nav>
        <a href="#/search" class="circle lg search-bubble" data-tab="search" aria-label="Search"><span data-icon="search"></span></a>
      </div>
    </div>

    <!-- Full-screen Now Playing -->
    <section class="player" id="player" aria-label="Now playing" aria-hidden="true">
      <div class="art-frame player-art" data-tilt="8" data-act="immersive" role="button" tabindex="0" aria-label="Show lyrics full screen">
        <div class="art-melt" aria-hidden="true"><img class="np-art" alt="" /></div>
        <div class="art-inner"><img class="np-art" alt="" /><div class="art-gloss"></div></div>
      </div>
      <header class="player-head">
        <button class="circle lg" data-act="close-player" aria-label="Close player" data-icon="chevronDown"></button>
        <div class="playing-from"><span>Playing from</span><b class="np-context">Spotifier</b></div>
        <button class="circle lg" data-act="more" aria-label="More options" data-icon="more"></button>
      </header>
      <div class="player-body">
        <div class="info-pill lg">
          <div class="info-meta">
            <h2 class="title np-title" data-text="Nothing playing">Nothing playing</h2>
            <p class="np-artist">Pick something from your library</p>
          </div>
          <button class="circle lg small" data-act="device" aria-label="Choose device" data-icon="device"></button>
          <button class="circle lg small save-btn" data-act="save" aria-label="Save to Liked Songs" data-icon="heartOutline"></button>
        </div>
        <div class="progress-block">
          <div class="range progress" role="slider" aria-label="Seek" tabindex="0"><div class="range-fill"></div><div class="range-thumb lg"></div></div>
          <div class="times"><span class="t-pos">0:00</span><span class="t-left">-0:00</span></div>
        </div>
        <div class="controls">
          <button class="circle lg small" data-act="shuffle" aria-label="Shuffle" data-icon="shuffle"></button>
          <button class="circle lg mid" data-act="prev" aria-label="Previous" data-icon="prev"></button>
          <button class="circle lg big play-toggle" data-act="toggle" aria-label="Play"></button>
          <button class="circle lg mid" data-act="next" aria-label="Next" data-icon="next"></button>
          <button class="circle lg small" data-act="repeat" aria-label="Repeat" data-icon="repeat"></button>
        </div>
        <div class="volume-row">
          <button class="icon-btn" data-act="mute" aria-label="Mute" data-icon="volume"></button>
          <div class="range volume" role="slider" aria-label="Volume" tabindex="0"><div class="range-fill"></div><div class="range-thumb lg"></div></div>
        </div>
        <div class="card lyrics-card lg">
          <div class="card-head">
            <b>Lyrics</b>
            <button class="icon-btn" data-act="immersive" aria-label="Full screen lyrics" data-icon="expand"></button>
          </div>
          <div class="lyrics-box" id="lyrics-main"></div>
        </div>
        <div class="card lg upnext">
          <div class="card-head"><b>Up next</b></div>
          <div id="queue-list" class="rows"></div>
        </div>
        <p class="device-line"></p>
      </div>
    </section>

    <!-- Full screen lyrics -->
    <div class="immersive" id="immersive" aria-hidden="true">
      <div class="imm-left">
        <div class="art-frame big">
          <div class="art-melt" aria-hidden="true"><img class="np-art" alt="" /></div>
          <div class="art-inner"><img class="np-art" alt="" /><div class="art-gloss"></div></div>
        </div>
        <h2 class="title np-title" data-text=""></h2>
        <p class="np-artist"></p>
        <div class="controls">
          <button class="circle lg mid" data-act="prev" aria-label="Previous" data-icon="prev"></button>
          <button class="circle lg big play-toggle" data-act="toggle" aria-label="Play"></button>
          <button class="circle lg mid" data-act="next" aria-label="Next" data-icon="next"></button>
        </div>
      </div>
      <div class="lyrics-box big" id="lyrics-imm"></div>
      <button class="circle lg imm-close" data-act="immersive" aria-label="Exit full screen lyrics" data-icon="chevronDown"></button>
    </div>

    <!-- Customize sheet -->
    <aside class="sheet lg" id="settings" aria-label="Customize" aria-hidden="true">
      <div class="sheet-head">
        <h2 class="title" data-text="Customize">Customize</h2>
        <button class="circle lg small" data-act="close-sheet" aria-label="Close" data-icon="close"></button>
      </div>
      <div class="sheet-body" id="settings-body"></div>
    </aside>

    <div class="scrim" data-act="close-sheet"></div>
    <div class="modal-wrap" id="modal" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
